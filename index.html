  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e8f4fd; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #root { min-height: 100vh; }
    #loading {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #1a6fa8 0%, #2196c4 50%, #1aadad 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader-logo {
      width: 90px; height: 90px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-title {
      color: white; font-size: 28px; font-weight: 800;
      margin-top: 20px; letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .loader-sub {
      color: rgba(255,255,255,0.75); font-size: 14px; margin-top: 8px;
    }
    .loader-dots {
      display: flex; gap: 8px; margin-top: 24px;
    }
    .loader-dots span {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.7);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255,255,255,0.3)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 24px rgba(255,255,255,0.5)); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading">
    <svg class="loader-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <rect x="14" y="28" width="36" height="24" rx="5" fill="#2563eb" opacity="0.95"/>
      <path d="M24 28v-5a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v5" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" fill="none"/>
      <line x1="14" y1="40" x2="50" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <rect x="28" y="36" width="8" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
      <path d="M32 24 L32 12 M32 12 L27 17 M32 12 L37 17" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="14" r="5" fill="#10b981" opacity="0.9"/>
      <circle cx="50" cy="14" r="8" fill="#10b981" opacity="0.2"/>
    </svg>
    <div class="loader-title">CareerHope AI</div>
    <div class="loader-sub">كاريير هوب — رفيقك في رحلة العودة المهنية</div>
    <div class="loader-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <!-- Load App -->
  <script type="text/babel" src="App.jsx" data-presets="react"></script>

  <script>
    // Hide loading screen once React mounts
    window.addEventListener('load', () => {
      setTimeout(() => {
        const el = document.getElementById('loading');
        if (el) el.classList.add('hidden');
        setTimeout(() => { if (el) el.remove(); }, 500);
      }, 1200);
    });
  </script>
