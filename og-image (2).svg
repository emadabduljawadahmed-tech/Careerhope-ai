  <rect x="702" y="340" width="168" height="50" rx="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="786" y="372" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">💼 فرص عمل</text>

  <!-- Pill 5 -->
  <rect x="888" y="340" width="212" height="50" rx="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="994" y="372" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">🎬 فيديوهات تحفيزية</text>

