  <rect x="100" y="420" width="120" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="160" y="444" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">🇸🇦 عربي</text>

  <rect x="234" y="420" width="130" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="299" y="444" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">🇺🇸 English</text>

  <rect x="378" y="420" width="110" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="433" y="444" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">🇨🇳 中文</text>

  <!-- Free badge -->
  <rect x="510" y="420" width="100" height="36" rx="18" fill="rgba(39,174,96,0.4)" stroke="rgba(39,174,96,0.6)" stroke-width="1.5"/>
  <text x="560" y="444" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">✅ مجاني</text>

  <!-- Copyright -->
  <text x="600" y="535" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)" text-anchor="middle">© 2026 عماد عبدالجواد إبراهيم أحمد — CareerHope AI — جميع الحقوق محفوظة</text>
