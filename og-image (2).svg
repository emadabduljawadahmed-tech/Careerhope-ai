  <circle cx="80" cy="80" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1150" cy="560" r="160" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1100" cy="100" r="80" fill="rgba(255,255,255,0.04)"/>
  <circle cx="100" cy="560" r="90" fill="rgba(255,255,255,0.04)"/>

  <!-- Card background -->
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Logo mark -->
  <rect x="100" y="110" width="100" height="100" rx="22" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Briefcase -->
  <rect x="118" y="142" width="64" height="42" rx="5" fill="#2563eb" opacity="0.95"/>
  <path d="M136 142v-8a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v8" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="118" y1="162" x2="182" y2="162" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <rect x="146" y="157" width="8" height="9" rx="2" fill="rgba(255,255,255,0.3)"/>
  <!-- Arrow up -->
  <path d="M150 138 L150 122 M150 122 L144 129 M150 122 L156 129" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="178" cy="116" r="5" fill="#10b981" opacity="0.9"/>

  <!-- App name Arabic -->
  <text x="220" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" fill="white" opacity="0.97">كاريير هوب</text>

